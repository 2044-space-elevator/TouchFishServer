name: Build & Release TouchFishServer

on:
  push

concurrency:
  group: touchfishserver-dev-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux
            zip_name: TouchFishServer_linux.zip
          - os: macos-latest
            platform_name: macos
            zip_name: TouchFishServer_macos.zip
          - os: windows-latest
            platform_name: windows
            zip_name: TouchFishServer_windows.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: pyinstaller main.py --collect-all captcha --collect-all werkzeug --paths . --name TouchFishServer

      - name: Show dist contents
        shell: bash
        run: ls -laR dist

      - name: Zip dist -> ${{ matrix.zip_name }}
        shell: bash
        run: |
          set -euxo pipefail
          python - "${{ matrix.zip_name }}" <<'PY'
          import sys, zipfile
          from pathlib import Path

          dst = Path(sys.argv[1])
          src = Path('dist')
          with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(src.rglob('*')):
                  if f.is_file():
                      z.write(f, f.relative_to(src).as_posix())
          print(f'created {dst} ({dst.stat().st_size} bytes)')
          PY

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error

      # ---------------- Windows only: Inno Setup 安装包 ----------------
      - name: Install Inno Setup (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # 兜底：若仓库中未随附简体中文语言文件，则下载官方文件到仓库路径
          $langFile = "packaging\windows\Languages\ChineseSimplified.isl"
          if (-not (Test-Path $langFile)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $langFile) | Out-Null
            curl.exe -L -s -o $langFile "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
            if (-not (Test-Path $langFile)) {
              curl.exe -L -s -o $langFile "https://cdn.jsdelivr.net/gh/jrsoftware/issrc@main/Files/Languages/ChineseSimplified.isl"
            }
            if (-not (Test-Path $langFile)) { throw "Could not obtain ChineseSimplified.isl" }
          }
          $iscc = Get-Command "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "Using ISCC: $($iscc.Source)"
          & $iscc.Source "packaging\windows\installer.iss"
          Get-Item "TouchFishServer_windows-setup.exe" | Select-Object FullName, Length

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TouchFishServer_windows-setup.exe
          path: TouchFishServer_windows-setup.exe
          if-no-files-found: error

  release:
    name: Publish release to tag dev-build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: ls -laR release-artifacts/

      - name: Create/Update GitHub Release on tag dev-build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: dev-build
          prerelease: true
          body: |
            ## TouchFishServer dev-build

            Auto-generated by GitHub Actions (Python 3.10 + PyInstaller).

            ### 资产 Assets
            - `TouchFishServer_linux.zip` — Linux 构建包
            - `TouchFishServer_macos.zip` — macOS 构建包
            - `TouchFishServer_windows.zip` — Windows 构建包（免安装）
            - `TouchFishServer_windows-setup.exe` — Windows 安装程序（Inno Setup）
          files: release-artifacts/*
          fail_on_unmatched_files: false
